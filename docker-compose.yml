services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}"
      MYSQL_DATABASE: slowcoffee_db
    ports: ["3307:3306"]
    volumes: ["slowcoffee_mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  api:
    build:
      context: ./src
      dockerfile: SlowCoffee.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=database;Port=3306;Database=slowcoffee_db;User=root;Password=${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env};"
    ports: ["8080:8080"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  slowcoffee_mysql_data:
