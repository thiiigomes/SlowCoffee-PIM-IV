name: Slow Coffee CI
on: [push,pull_request]
jobs: build-test:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with: {dotnet-version: '8.0.x'}
    - run: dotnet restore SlowCoffee.PIMIV.sln
    - run: dotnet build SlowCoffee.PIMIV.sln --configuration Release --no-restore
    - run: dotnet test tests/SlowCoffee.Tests/SlowCoffee.Tests.csproj --configuration Release --no-build
